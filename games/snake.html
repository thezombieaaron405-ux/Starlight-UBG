<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Snake</title>
		<link rel="stylesheet" href="game.css" />
	</head>
	<body>
		<div class="hud">Score: <b id="score">0</b> · Best: <b id="best">0</b></div>
		<canvas id="c" width="400" height="400"></canvas>
		<p class="help">Arrow keys / WASD or swipe. Space or tap to start.</p>
		<script>
			const c = document.getElementById("c");
			const ctx = c.getContext("2d");
			const N = 20;
			const S = c.width / N;
			let snake, dir, nextDir, food, score, running, timer;
			let best = +(localStorage.getItem("snake-best") || 0);
			document.getElementById("best").textContent = best;

			function reset() {
				snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
				dir = nextDir = { x: 1, y: 0 };
				score = 0;
				document.getElementById("score").textContent = 0;
				placeFood();
			}

			function placeFood() {
				do {
					food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
				} while (snake.some((p) => p.x === food.x && p.y === food.y));
			}

			function step() {
				dir = nextDir;
				const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
				const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
				const hitSelf = snake.some((p) => p.x === head.x && p.y === head.y);
				if (hitWall || hitSelf) return gameOver();
				snake.unshift(head);
				if (head.x === food.x && head.y === food.y) {
					score++;
					document.getElementById("score").textContent = score;
					placeFood();
				} else {
					snake.pop();
				}
				draw();
			}

			function draw(message) {
				ctx.fillStyle = "#11152a";
				ctx.fillRect(0, 0, c.width, c.height);
				ctx.fillStyle = "#ff5c8a";
				ctx.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);
				snake.forEach((p, i) => {
					ctx.fillStyle = i === 0 ? "#7cff8a" : "#3ecf5a";
					ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
				});
				if (message) {
					ctx.fillStyle = "rgba(0,0,0,.55)";
					ctx.fillRect(0, 0, c.width, c.height);
					ctx.fillStyle = "#fff";
					ctx.font = "bold 24px system-ui";
					ctx.textAlign = "center";
					ctx.fillText(message, c.width / 2, c.height / 2);
				}
			}

			function start() {
				if (running) return;
				reset();
				running = true;
				timer = setInterval(step, 110);
			}

			function gameOver() {
				running = false;
				clearInterval(timer);
				if (score > best) {
					best = score;
					localStorage.setItem("snake-best", best);
					document.getElementById("best").textContent = best;
				}
				draw("Game over · Space to retry");
			}

			function turn(x, y) {
				if (x === -dir.x && y === -dir.y) return;
				nextDir = { x, y };
			}

			addEventListener("keydown", (e) => {
				const k = e.key.toLowerCase();
				if (k === " ") start();
				else if (k === "arrowup" || k === "w") turn(0, -1);
				else if (k === "arrowdown" || k === "s") turn(0, 1);
				else if (k === "arrowleft" || k === "a") turn(-1, 0);
				else if (k === "arrowright" || k === "d") turn(1, 0);
				else return;
				e.preventDefault();
			});

			let touch = null;
			c.addEventListener("touchstart", (e) => {
				touch = e.touches[0];
				if (!running) start();
			}, { passive: true });
			c.addEventListener("touchend", (e) => {
				if (!touch) return;
				const t = e.changedTouches[0];
				const dx = t.clientX - touch.clientX;
				const dy = t.clientY - touch.clientY;
				if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
					if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
					else turn(0, Math.sign(dy));
				}
				touch = null;
			});
			c.addEventListener("click", start);

			reset();
			draw("Press Space to start");
		</script>
	</body>
</html>
